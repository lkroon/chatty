# Local dev dependency: Postgres only. Run `npm run dev` at the repo
# root against this for the api/web dev servers — the api and web apps
# themselves run on the host, not in containers, during development.
#
# Matches the dev DATABASE_URL documented in .env.example:
#   postgresql://app:app@localhost:5432/appdb
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
