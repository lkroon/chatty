name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test api
        run: npm run test -w apps/api

      - name: Test web
        run: npm run test -w apps/web -- --watch=false --browsers=ChromeHeadless

      - name: Build
        run: npm run build
