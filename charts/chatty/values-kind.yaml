# Gate 2 overrides for the local kind cluster. Layered on top of values.yaml
# by argocd/chatty-kind.yaml, which k8s/cluster-up.sh applies instead of the
# production Application — so proving the chart locally never means editing
# the values Argo CD syncs to Hetzner.
#
# Three things differ from production, and only these three:
#   - the host is plain `localhost`, served by kind's hostPort 80
#   - APP_ORIGIN matches it exactly
#   - the session cookie drops `secure`, since this is http
#
# The host is `localhost` and not a localtest.me name on purpose, even
# though both resolve to 127.0.0.1. Google will only accept a plain-http
# redirect URI when the host is literally localhost or 127.0.0.1, so
# http://localhost/auth/google/callback is the only http callback the
# existing OAuth client can carry. Serving the app on a different host than
# APP_ORIGIN would send the browser to a callback the ingress has no rule
# for, and drop the session cookie on a different origin than the app.
app:
  origin: http://localhost
  cookieSecure: "false"
  # Off for the kind gate, unlike production. The pod cannot reach the host's
  # docker-compose SearXNG, and running SearXNG in-cluster to prove a path
  # that production does not use (production is Brave) would be testing the
  # wrong thing. The web-search checks belong to Gate 1 against the dev
  # server, and to Gate 3 against Brave on the real cluster.
  webSearchEnabled: false

ingress:
  host: localhost
  tls:
    enabled: false
