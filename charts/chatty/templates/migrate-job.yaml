# Runs the Drizzle migrations (apps/api/src/db/run-migrations.ts, compiled
# to dist/db/run-migrations.js) against the chart's own Postgres, using the
# same image as the app Deployment.
#
# PostgreSQL resources use sync wave -2, this migration uses -1, and the app
# Deployment uses the default wave 0. Argo CD therefore waits for the database
# and successful migration before replacing application pods.
apiVersion: batch/v1
kind: Job
metadata:
  name: chatty-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app: chatty-migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-db
          image: postgres:16
          command:
            - sh
            - -c
            - |
              until pg_isready -h db -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "waiting for db..."
                sleep 2
              done
          envFrom:
            - secretRef:
                name: db-credentials
      containers:
        - name: migrate
          image: {{ .Values.imageRegistry }}/chatty:{{ .Values.imageTag }}
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/db/run-migrations.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL
