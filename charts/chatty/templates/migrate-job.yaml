# Runs the Drizzle migrations (apps/api/src/db/run-migrations.ts, compiled
# to dist/db/run-migrations.js) against the chart's own Postgres, using the
# same image as the app Deployment.
#
# Every annotation below has to agree on one phase: PostSync.
#
# The earlier post-install,pre-upgrade pairing was wrong, and Gate 2's
# fresh-install check caught it. Argo CD registers a Helm hook under *every*
# phase its annotations map to, so pre-upgrade registered this Job as a
# PreSync hook too — and PreSync is the first thing that runs on a fresh
# sync, before the Postgres StatefulSet and its db-credentials Secret in
# this same chart exist. Observed on kind: `Init:CreateContainerConfigError,
# secret "db-credentials" not found`, with the whole first sync stuck behind
# it.
#
# post-upgrade maps to PostSync exactly as post-install does, so install and
# upgrade now take the same path and nothing depends on which annotation
# Argo CD's version gives precedence to. The argocd.argoproj.io/hook
# annotation states the same phase directly, belt and braces.
#
# The cost is that migrations run *after* the new pods are already serving,
# so there is a brief window where new code meets the old schema. For an
# append-only single-user app with additive Drizzle migrations that is the
# cheaper failure than a first sync that cannot complete at all. If a
# destructive migration ever lands, it needs the expand/contract treatment
# rather than a phase change here.
#
# Both delete-policy annotations are set because it is not verified which
# one this Argo CD version honors for a Helm hook resource.
apiVersion: batch/v1
kind: Job
metadata:
  name: chatty-migrate
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app: chatty-migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-db
          image: postgres:16
          command:
            - sh
            - -c
            - |
              until pg_isready -h db -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "waiting for db..."
                sleep 2
              done
          envFrom:
            - secretRef:
                name: db-credentials
      containers:
        - name: migrate
          image: {{ .Values.imageRegistry }}/chatty:{{ .Values.imageTag }}
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/db/run-migrations.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL
