# Bumped by the release workflow on every tag (mirrors lkroon/frameworks'
# imageRegistry/imageTag pattern). Single image: the api container also
# serves the built Angular web app (see apps/api/src/main.ts's
# @nestjs/serve-static usage) — there is no separate web Deployment.
imageRegistry: ghcr.io/lkroon
imageTag: "v0.1.6"

app:
  # Origin whose /auth/google/callback is registered with Google. No
  # trailing slash. Also used as the cookie-secure default's paired value.
  origin: https://chat.lkroon.nl
  # String "true"/"false" (env vars are always strings). Set to "false"
  # only for local plain-http.
  cookieSecure: "true"
  # CSV of full email addresses, case-insensitive exact match. Empty
  # string means nobody is allowed in — set this before a real deploy.
  allowedEmails: "luckroon92@gmail.com"
  dailyMessageLimit: 200
  # e.g. https://opencode.ai/zen/go/v1 — verified 2026-09-02, see .env.example.
  opencodeBaseUrl: "https://opencode.ai/zen/go/v1"
  # CSV of bare model ids. Empty = /api/models serves only the cached
  # upstream list.
  opencodeModels: ""
  # Wave 1.5 — model-driven web_search/web_fetch tools. Off = no `tools`
  # sent upstream, no chips, byte-for-byte the pre-Wave-1.5 behaviour.
  #
  # On by default: a chat app that cannot look anything up is the lesser
  # product, and the per-exchange budget in apps/api/src/tools/tool-budget.ts
  # is what keeps a metered key safe, not this flag.
  #
  # NOTE: with searchProvider=brave below, this makes BRAVE_SEARCH_API_KEY a
  # required key in the auth Secret — the pod deliberately fails at boot
  # without it rather than discovering the problem at the first search.
  webSearchEnabled: true
  # 'searxng' | 'brave'. Unknown value fails the pod at boot.
  searchProvider: brave
  # Only used when searchProvider=searxng; ignored (and may be left
  # empty) for brave. No trailing slash.
  searxngBaseUrl: ""
  # CSV of model ids allowed to receive a `tools` array. Each one here was
  # live-probed against the real OpenCode API and confirmed to honor
  # `tools` and actually call the function (2026-09-02). An id not in this
  # list streams with no `tools` sent and no chips, rather than risk a
  # silent no-op tool call against an unverified model.
  toolCapableModels: glm-5.3,glm-5.3-flash,glm-5,deepseek-v4-flash,qwen3.8-flash,kimi-k2.7-code,mimo-v2.5
  # Wave 2 — the model may propose a calendar event, task or email; only a
  # user tap creates or sends it (POST /api/proposals/:id/confirm re-reads
  # the stored row). Off = those tools are not offered at all.
  #
  # Turning this on changes the consent screen: three write scopes are added,
  # so every already-connected account must disconnect and reconnect once.
  googleWriteToolsEnabled: false
  # Days a pending proposal may still be confirmed.
  proposalTtlDays: 3
  # IANA zone for the daily briefing's "today" and all displayed times.
  briefingTimeZone: Europe/Amsterdam
  # Model that writes the briefing summary. Deliberately not the chat
  # model picker's value.
  briefingModel: glm-5.3-flash

# Name of the Secret created out-of-band by the operator (kubectl, not this
# chart) with keys OPENCODE_API_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# SESSION_SECRET, GOOGLE_TOKEN_ENCRYPTION_KEY, plus BRAVE_SEARCH_API_KEY when
# app.searchProvider=brave (omit it entirely for searxng — envFrom tolerates
# its absence, the provider adapter does not). See k8s/cluster-up.sh.
authSecretName: chatty-auth

db:
  # Dev-grade credentials; move to sealed-secrets/SOPS before a public deploy
  user: app
  password: app
  database: appdb
  storage: 1Gi

ingress:
  className: nginx
  host: chat.lkroon.nl
  tls:
    # Public host terminates TLS at the ingress with a cert-manager-issued
    # Let's Encrypt cert. The ClusterIssuer named here must already exist on
    # the cluster (see docs/deployment.md) — cert-manager is a platform
    # prerequisite, not part of this chart. values-kind.yaml turns this off
    # for the local plain-http kind cluster.
    enabled: true
    secretName: "chatty-tls"
    clusterIssuer: "letsencrypt-prod"

resources:
  api:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 384Mi
  postgres:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 384Mi

migration:
  backoffLimit: 2
  activeDeadlineSeconds: 300
